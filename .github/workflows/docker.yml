# Construye la imagen `web` y la publica en GitHub Container Registry.
#
# Si la variable del repositorio INDICE_URL apunta al índice publicado por
# indice.yml, la imagen lo lleva dentro y arranca sin construirlo. La demo de
# Hugging Face (deploy/huggingface/) parte de esta imagen.

name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pone el nombre en minúsculas (GHCR lo exige) y las etiquetas: latest en
      # master, y la versión en cada tag v*.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            INDICE_URL=${{ vars.INDICE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
