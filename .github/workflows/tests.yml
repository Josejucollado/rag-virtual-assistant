name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # El torch de CPU antes que nada: si no, sentence-transformers trae el de
      # CUDA (varios GB) para unos tests que no tocan ningún modelo.
      - name: Instalar dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Sin secretos: los tests no llaman a ninguna API ni abren ChromaDB.
      - name: Tests
        run: python -m pytest -q
